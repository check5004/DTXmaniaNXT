[package]
name = "dtxmanianxt"
description = "DTXmaniaNXT: native DTX drum game and practice app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dtx = { path = "../dtx" }
engine = { path = "../engine" }
library = { path = "../library" }
i18n = { path = "../i18n" }
records = { path = "../records" }
nx = { path = "../nx" }
video = { path = "../video" }
drum_module = { path = "../drum_module" }
anyhow = "1"
cpal = "0.18"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"
midir = "0.11"
rtrb = "0.4"
symphonia = { version = "0.6", features = ["wav", "pcm", "ogg", "vorbis", "mp3"] }
log = "0.4"
env_logger = "0.11"
pollster = "1"
wgpu = "30"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
# 画面を残すファイルの名前に、この PC の日時を使う
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
# 練習で BGM を音程を保ったまま遅くする（Rust だけで書かれていて、ビルドに C++ や LLVM が要らない）
timestretch = { version = "0.16", default-features = false }
# NX のスキンの画像（PNG・JPEG・BMP）を読む
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# NX と同じ書体で文字を描く
ab_glyph = "0.2"
ttf-parser = "0.25"
# アプリに入れた NX のスキン（assets/skin）を exe に埋め込む（開発中のビルドはフォルダから読む）
rust-embed = "8"
# インストールと、GitHub のリリースからの自動更新（Setup.exe と差分の更新を作る vpk と組で使う）
velopack = "1.2"
# 設定の画面から譜面エディタ（Web アプリ）を既定のブラウザで開く（egui-winit も使っている）
webbrowser = "1"
# 開発者メニューで、issue の下書きをクリップボードに入れる（egui-winit も使っている）
arboard = { version = "3", default-features = false }

[build-dependencies]
# Windows の exe にアプリのアイコンと版の情報を埋め込む（build.rs。Windows SDK の rc.exe を使う）
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true
