[package]
name = "dtxmanianxt"
description = "DTXmaniaNXT: native DTX drum game and practice app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dtx = { path = "../dtx" }
engine = { path = "../engine" }
anyhow = "1"
cpal = "0.18"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"
midir = "0.11"
rtrb = "0.4"
symphonia = { version = "0.6", features = ["wav", "pcm", "ogg", "vorbis", "mp3"] }
log = "0.4"
env_logger = "0.11"
pollster = "1"
wgpu = "30"
winit = "0.30"

[lints]
workspace = true
