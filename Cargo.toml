[workspace]
resolver = "3"
members = ["crates/dtx", "crates/engine", "crates/library", "crates/records", "crates/nx", "crates/app"]

[workspace.package]
version = "0.5.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/check5004/DTXmaniaNXT"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# 音程を保つ伸ばしは最適化しないと 20 倍ほど遅い（8 秒の音に 7 秒）。開発中のビルドでもこれだけは最適化する
[profile.dev.package.timestretch]
opt-level = 3

[profile.dev.package.timestretch-core]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
