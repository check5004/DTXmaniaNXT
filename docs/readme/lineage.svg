<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Where DTXmaniaNXT comes from</title>
<desc id="desc">DTXMania, DTXManiaXG verK, DTXManiaNX by limyz, DTXManiaNX v2.0 by BocuD, and DTXmaniaNXT. NXT is new code. It started from the v2.0 skin and is replacing it with its own artwork, step by step.</desc>
