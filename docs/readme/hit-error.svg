<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
<title id="title">Hit error bar</title>
<desc id="desc">Each hit leaves a line where it landed, early to the left and late to the right. The marker shows the average of the last 20 hits.</desc>
<style>
text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono','Cascadia Mono',Consolas,Menlo,monospace}
.fb{transform-box:fill-box;transform-origin:50% 50%}
@keyframes tk{0%{opacity:1}50.00%{opacity:0}100%{opacity:0}}.tk{opacity:0;animation:tk 8.0s linear infinite}
@keyframes av{0.0%{transform:translateX(0.0px)}12.5%{transform:translateX(-56.1px)}25.0%{transform:translateX(-40.8px)}37.5%{transform:translateX(-24.3px)}50.0%{transform:translateX(-25.0px)}62.5%{transform:translateX(-19.9px)}75.0%{transform:translateX(-13.1px)}87.5%{transform:translateX(-6.7px)}100.0%{transform:translateX(-10.2px)}}.av{animation:av 8.0s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1018"/><stop offset="1" stop-color="#151B2E"/></linearGradient></defs>
