<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
<title id="title">Updates when you choose</title>
<desc id="desc">A new version appears as a row under the title menu. Choose it to download while you keep playing, then restart to switch.</desc>
<style>
