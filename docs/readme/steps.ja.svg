.w8{opacity:0;animation:w8 6.0s linear infinite}
@keyframes w9{0.000%{opacity:0}68.333%{opacity:0}70.000%{opacity:1}73.000%{opacity:1}74.667%{opacity:0}100.000%{opacity:0}}
