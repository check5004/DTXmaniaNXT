<circle class="w10" cx="775" cy="101" r="20" fill="#FFD54F" fill-opacity="0.75"/>
<circle cx="803" cy="65" r="16" fill="#141B28" stroke="#66BB6A" stroke-width="3"/>
<circle class="w11" cx="803" cy="65" r="16" fill="#66BB6A" fill-opacity="0.75"/>
<circle cx="849" cy="101" r="20" fill="#141B28" stroke="#FF9800" stroke-width="3"/>
<circle class="w12" cx="849" cy="101" r="20" fill="#FF9800" fill-opacity="0.75"/>
<circle cx="859" cy="57" r="20" fill="#141B28" stroke="#42A5F5" stroke-width="3"/>
<circle class="w13" cx="859" cy="57" r="20" fill="#42A5F5" fill-opacity="0.75"/>
<path d="M679 127 q 40 -10 70 -18" stroke="#3A4A66" stroke-width="3" fill="none"/>
<text x="679" y="141" font-size="10" fill="#9AA8BC" font-weight="700" text-anchor="start" class="mono">USB-MIDI</text>
<circle cx="678" cy="178" r="14" fill="none" stroke="#5CE1E6" stroke-width="2"/>
<text x="678" y="183" font-size="14" fill="#5CE1E6" font-weight="800" text-anchor="middle">3</text>
<text x="702" y="184" font-size="19" fill="#E8EEF7" font-weight="800" text-anchor="start">つないで遊ぶ</text>
<text x="666" y="210" font-size="13" fill="#9AA8BC" font-weight="400" text-anchor="start">電子ドラムを USB-MIDI で</text>
<text x="666" y="229" font-size="13" fill="#9AA8BC" font-weight="400" text-anchor="start">つなげば、自動で見つけます。</text>
