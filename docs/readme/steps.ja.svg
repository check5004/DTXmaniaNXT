<text x="479" y="109" font-size="11" fill="#9AA8BC" font-weight="600" text-anchor="middle" class="mono">DTXFiles</text>
<g class="dp"><path d="M453 69 h18 l6 6 h28 v32 h-52 z" fill="#FFD54F" stroke="#B8901C"/><path d="M453 79 h52 v22 h-52 z" fill="#FFE38A"/></g>
<g class="w6"><rect x="509" y="37" width="64" height="22" rx="11" fill="#7CF29A"/><text x="541" y="52" font-size="12" fill="#06121B" font-weight="800" text-anchor="middle">6 曲</text></g>
<circle cx="360" cy="178" r="14" fill="none" stroke="#5CE1E6" stroke-width="2"/>
<text x="360" y="183" font-size="14" fill="#5CE1E6" font-weight="800" text-anchor="middle">2</text>
<text x="384" y="184" font-size="19" fill="#E8EEF7" font-weight="800" text-anchor="start">曲を足す</text>
<text x="348" y="210" font-size="13" fill="#9AA8BC" font-weight="400" text-anchor="start">DTX の曲のフォルダを選ぶか、</text>
<text x="348" y="229" font-size="13" fill="#9AA8BC" font-weight="400" text-anchor="start">窓にドロップします。</text>
