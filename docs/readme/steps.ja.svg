@keyframes w13{0.000%{opacity:0}87.000%{opacity:0}88.667%{opacity:1}91.667%{opacity:1}93.333%{opacity:0}100.000%{opacity:0}}
.w13{opacity:0;animation:w13 6.0s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
