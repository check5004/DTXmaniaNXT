<text x="30" y="210" font-size="13" fill="#9AA8BC" font-weight="400" text-anchor="start">Setup.exe を実行するだけ。</text>
<text x="30" y="229" font-size="13" fill="#9AA8BC" font-weight="400" text-anchor="start">管理者の権限も NX も要りません。</text>
