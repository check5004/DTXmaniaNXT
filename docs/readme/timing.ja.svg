<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">叩いた時刻で判定する</title>
<desc id="desc">MIDI の打撃は届いた瞬間の時刻を付け、曲の音の再生位置と比べて判定する。画面のフレームに丸めない。</desc>
<style>
text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono','Cascadia Mono',Consolas,Menlo,monospace}
.fb{transform-box:fill-box;transform-origin:50% 50%}
@keyframes inA{0%{transform:translateY(-34px);opacity:0}25.00%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}.ia{animation:inA 4.0s ease-out infinite}
@keyframes w2{0.000%{opacity:0}22.500%{opacity:0}25.000%{opacity:1}92.500%{opacity:1}95.000%{opacity:0}100.000%{opacity:0}}
.w2{opacity:0;animation:w2 4.0s linear infinite}
@keyframes w3{0.000%{opacity:0}37.500%{opacity:0}40.000%{opacity:1}92.500%{opacity:1}95.000%{opacity:0}100.000%{opacity:0}}
.w3{opacity:0;animation:w3 4.0s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1018"/><stop offset="1" stop-color="#151B2E"/></linearGradient></defs>
<rect x="1" y="1" width="958" height="298" rx="18" fill="url(#bg1)" stroke="#263247"/>
<text x="40" y="46" font-size="22" fill="#E8EEF7" font-weight="800" text-anchor="start">画面のフレームではなく、叩いた時刻で判定</text>
<text x="40" y="72" font-size="14" fill="#9AA8BC" font-weight="400" text-anchor="start">MIDI の打撃は届いた瞬間に時刻を付け、曲の音がいま鳴っている位置と比べます。</text>
<text x="40" y="135" font-size="15" fill="#9AA8BC" font-weight="700" text-anchor="start">フレームで見る場合</text>
<line x1="240.0" y1="130" x2="800.0" y2="130" stroke="#33415A" stroke-width="2"/>
<rect x="282.0" y="116" width="476.0" height="28" rx="6" fill="#7CF29A" fill-opacity="0.06"/>
<line x1="520" y1="108" x2="520" y2="152" stroke="#E8EEF7" stroke-width="2"/>
<text x="520" y="102" font-size="11" fill="#9AA8BC" font-weight="600" text-anchor="middle">音符</text>
