<line x1="377.7" y1="120" x2="377.7" y2="140" stroke="#56657E" stroke-width="2"/>
<line x1="494.3" y1="120" x2="494.3" y2="140" stroke="#56657E" stroke-width="2"/>
<line x1="611.0" y1="120" x2="611.0" y2="140" stroke="#56657E" stroke-width="2"/>
<line x1="727.7" y1="120" x2="727.7" y2="140" stroke="#56657E" stroke-width="2"/>
<text x="812.0" y="135" font-size="11" fill="#5B6B82" font-weight="400" text-anchor="start">フレーム（60fps）</text>
<text x="40" y="231" font-size="15" fill="#5CE1E6" font-weight="700" text-anchor="start">DTXmaniaNXT</text>
<line x1="240.0" y1="226" x2="800.0" y2="226" stroke="#33415A" stroke-width="2"/>
<rect x="282.0" y="212" width="476.0" height="28" rx="6" fill="#7CF29A" fill-opacity="0.06"/>
