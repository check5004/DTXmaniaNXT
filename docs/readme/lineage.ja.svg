<circle cx="55" cy="258" r="5" fill="#5CE1E6"/>
<text x="200" y="262" font-size="13" fill="#E8EEF7" font-weight="400" text-anchor="start">NXT のソースコードは Rust で新規に書いたもので、上流のコードは含みません。</text>
