<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">DTXmaniaNXT の系譜</title>
<desc id="desc">DTXMania、DTXManiaXG verK、limyz 版 DTXManiaNX、BocuD 版 DTXManiaNX v2.0、DTXmaniaNXT の順。NXT のソースコードは新規。スキンは v2.0 のものから始めて、段階的に自前の素材へ置き換え中。</desc>
