# cargo-about の設定。リリースに入れる THIRD-PARTY-LICENSES.html（使っているライブラリのライセンス表記）を作る。
# package.sh から呼ぶ。新しいライセンスのライブラリが入って作れなくなったら、ここに足す
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "MPL-2.0",
    "OFL-1.1",
]
# リリースを作る 3 つの OS
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
# 実行ファイルに入らないもの
ignore-build-dependencies = true
ignore-dev-dependencies = true
