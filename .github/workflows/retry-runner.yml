name: Retry without runner

# 実行機が付かないまま 15 分で取り消されたジョブ（コードの失敗ではない）を 2 回までやり直す
on:
  workflow_run:
    workflows: [CI, "CI (macOS)", Release]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # 取り消されていて、手順が 1 つも動いていないジョブ
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.conclusion == "cancelled" and ((.steps // []) | length) == 0) | "\(.id)\t\(.name)"')
          if [ -z "$jobs" ]; then
            echo "やり直すジョブは無い"
            exit 0
          fi
          echo "::notice::やり直す: $(cut -f2 <<< "$jobs" | paste -sd, -)"
          if [ "$(wc -l <<< "$jobs")" -eq 1 ]; then
            # そのジョブと、それを待つジョブ（Release の release）をやり直す
            gh run rerun --job "$(cut -f1 <<< "$jobs")"
          else
            gh run rerun "$RUN_ID" --failed
          fi
